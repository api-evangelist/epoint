generated: '2026-07-19'
method: searched
source: https://developer.epoint.az/en/errors
docs: https://developer.epoint.az/en/errors
description: >-
  Bank response codes returned in the `code` field of Epoint payment responses
  and callbacks. These are ISO-8583-style processor codes indicating how the
  acquiring bank processed the transaction. Complements
  epoint-problem-types-none (Epoint publishes no separate API-level error
  registry; the API envelope carries status:error + message + trace_id).
envelope:
  field: code
  companion_fields:
  - status
  - message
  - bank_response
  - trace_id
  masked_to_buyer: false
groups:
- id: success
  range: '000'
- id: decline
  range: 1xx
- id: pickup
  range: 2xx
- id: status-message
  range: 3xx
- id: other
  range: 4xx-9xx
