languages:
- az
- en
- ru
callbacks:
  ref: asyncapi/epoint-callbacks-webhooks.yml
  mechanism: >-
    Server-to-server POST to the merchant's result_url with data + signature;
    the merchant verifies the signature before trusting the payload.
rate_limiting:
  documented: false
  note: No published rate-limit headers or quotas in the developer docs.
