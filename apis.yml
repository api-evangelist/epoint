apis:
- name: Epoint Payment API
  description: >-
    REST payment gateway for accepting online card payments in Azerbaijan.
    Covers payment creation and hosted checkout, card registration/tokenization
    and saved-card charges, refunds and reversals, pre-authorization, split
    payments, installments, payouts, wallets, invoices, Apple Pay / Google Pay
    token widget, and a heartbeat health check. Authenticated with a merchant
    public_key + SHA1 signature; outcomes returned synchronously and via signed
    callbacks.
