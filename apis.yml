aid: epoint
name: Epoint
description: >-
  Epoint (epoint.az) is an Azerbaijani digital payment aggregator and
  e-commerce platform for small and medium enterprises, backed by 500 Global.
  It lets merchants accept online card payments on their website, mobile app, or
  social page and layers on card tokenization (saved cards), split payments,
  pre-authorization, installment payments, payouts to any Azerbaijani business
  card 24/7, wallets, invoicing, QR/link payments, recurring payments, and
  Apple Pay / Google Pay. Its REST payment API (base https://epoint.az/api/1)
  authenticates every request with a merchant public_key plus a SHA1
  data+signature scheme and returns results both synchronously and via signed
  callbacks to the merchant's result_url.
